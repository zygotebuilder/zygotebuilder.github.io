
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics-Accurate Mirror Simulator</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f8f9fa; }
    canvas { border: 2px solid #333; background-color: white; margin-top: 10px; cursor: crosshair; }
    .controls { margin: 15px; padding: 10px; background: #ddd; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Mirror Simulator (Spherical Optics)</h2>
  <div class="controls">
    <label>Mirror Type: </label>
    <select id="mirrorType"><option value="concave">Concave</option><option value="convex">Convex</option></select>
    <label>Object Distance (u): </label>
    <input id="objectDistance" type="range" min="20" max="180" value="100" />
    <span id="distVal">100</span>px
  </div>
  <canvas id="canvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const f = 100; // Focal length
    
    function draw() {
      const type = document.getElementById('mirrorType').value;
      const u = parseInt(document.getElementById('objectDistance').value);
      document.getElementById('distVal').innerText = u;
      
      ctx.clearRect(0, 0, 800, 400);
      const axisY = 200;
      const poleX = 400;

      // Draw Axis
      ctx.beginPath(); ctx.moveTo(0, axisY); ctx.lineTo(800, axisY); ctx.stroke();

      // Mirror Logic
      const isConcave = type === 'concave';
      ctx.beginPath();
      ctx.arc(isConcave ? poleX - f : poleX + f, axisY, f, 
              isConcave ? -0.3 : 2.84, isConcave ? 0.3 : 3.44);
      ctx.stroke();

      // Math: 1/f = 1/v + 1/u => v = (f*u)/(u-f)
      const u_val = -u; 
      const f_val = isConcave ? -f : f;
      const v = (f_val * u_val) / (u_val - f_val);
      const m = -v / u_val;

      // Draw Object (Height 50)
      ctx.strokeStyle = 'green';
      ctx.beginPath(); ctx.moveTo(poleX - u, axisY); ctx.lineTo(poleX - u, axisY - 50); ctx.stroke();

      // Draw Image
      ctx.strokeStyle = (v > 0) ? 'rgba(0,0,255,0.5)' : 'red';
      ctx.setLineDash((v > 0) ? [5, 5] : []);
      ctx.beginPath(); ctx.moveTo(poleX + v, axisY); ctx.lineTo(poleX + v, axisY - 50 * m); ctx.stroke();
      ctx.setLineDash([]);
      
      // Draw Rays (Simplified Parallel and Focal)
      ctx.strokeStyle = 'orange';
      ctx.beginPath();
      ctx.moveTo(poleX - u, axisY - 50); ctx.lineTo(poleX, axisY - 50); // Parallel
      ctx.lineTo(poleX + v, axisY - 50 * m); // Reflected
      ctx.stroke();
    }

    document.querySelectorAll('select, input').forEach(el => el.addEventListener('input', draw));
    draw();
  </script>
</body>
</html>
