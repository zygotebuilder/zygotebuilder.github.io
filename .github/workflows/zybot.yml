name: Zybot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  # --------------------------------------------------
  # OBSERVER
  # --------------------------------------------------
  inspect:
    name: 🔬 Inspect Zygote Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Zybot Observer
        run: python bot/observer/inspect.py


  # --------------------------------------------------
  # TESTER
  # --------------------------------------------------
  test:
    name: 🧪 Test Zygote Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Zybot Tester
        run: python bot/tester/test_projects.py


  # --------------------------------------------------
  # REPORTER
  # --------------------------------------------------
  report:
    name: 📋 Zybot Reporter
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub CLI
        run: gh --version

      - name: Run Zybot Reporter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/reporter/report.py


  # --------------------------------------------------
  # FIXER
  # --------------------------------------------------
  fixer:
    name: 🔧 Zybot Fixer
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitHub CLI
        run: gh --version

      - name: Run Zybot Fixer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/fixer/fix.py
