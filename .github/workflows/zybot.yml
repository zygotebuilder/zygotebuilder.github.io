
name: Zybot

on:
  push:
    branches:
      - projects
    paths-ignore:
      - "bot/archive/**"

  pull_request:

  workflow_dispatch:
    inputs:
      run_fixer:
        description: "Run Zybot Fixer?"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "30 12 * * *"

# Prevent overlapping Zybot workflow runs.
concurrency:
  group: zybot-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # OBSERVER
  # ============================================================

  inspect:
    name: 🔬 Inspect Zygote Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Zybot Observer
        run: python bot/observer/inspect.py


  # ============================================================
  # TESTER
  # ============================================================

  test:
    name: 🧪 Test Zygote Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      tests_passed: ${{ steps.run-tests.outputs.tests_passed }}
      failed_count: ${{ steps.run-tests.outputs.failed_count }}
      passed_count: ${{ steps.run-tests.outputs.passed_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Zybot Tester
        id: run-tests
        continue-on-error: true
        run: python bot/tester/test_projects.py

      - name: Upload structured test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zybot-test-results
          path: bot/tester/test-results.json
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # REPORTER
  # ============================================================

  report:
    name: 📋 Zybot Reporter
    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub CLI
        run: gh --version

      - name: Run Zybot Reporter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/reporter/report.py


  # ============================================================
  # ARCHIVIST
  # ============================================================

  archivist:
    name: 📚 Zybot Archivist
    needs: test

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/projects'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: projects

      - name: Run Zybot Archivist
        run: python bot/archivist/archive.py

      - name: Save archive
        run: |
          git config user.name "Zybot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot/archive/zybot-history.json

          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi

          git commit -m "🤖 Zybot: update archive"

          echo "🔄 Synchronizing with remote projects branch..."

          git fetch origin projects
          git rebase origin/projects

          echo "🚀 Pushing archive update..."

          git push origin HEAD:projects


  # ============================================================
  # FIXER
  # ============================================================

  fixer:
    name: 🔧 Zybot Fixer
    needs:
      - test
      - archivist

    if: >
      needs.test.outputs.tests_passed == 'true' &&
      needs.test.result == 'success' &&
      needs.archivist.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/projects' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_fixer == true
        )
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: projects

      - name: Show Fixer context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run Fixer: ${{ inputs.run_fixer }}"
          echo "Tests passed: ${{ needs.test.outputs.tests_passed }}"

      - name: Configure Git
        run: |
          git config user.name "Zybot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check GitHub CLI
        run: gh --version

      - name: Run Zybot Fixer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/fixer/fix.py


  # ============================================================
  # ZYBOT BRAIN
  # ============================================================

  thinker:
    name: 🧠 Zybot AI Thinker
    needs:
      - test
      - archivist

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/projects' &&
      needs.test.result == 'success' &&
      needs.archivist.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: projects


      # --------------------------------------------------------
      # SYNCHRONIZE WITH ARCHIVIST
      # --------------------------------------------------------

      - name: Synchronize with latest Archivist commit
        run: |
          git fetch origin projects
          git reset --hard origin/projects


      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # DOWNLOAD TEST RESULTS
      # --------------------------------------------------------

      - name: Download Zybot Tester results
        uses: actions/download-artifact@v4
        with:
          name: zybot-test-results
          path: bot/tester


      - name: Verify Tester report
        run: |
          REPORT="bot/tester/test-results.json"

          if [ ! -s "$REPORT" ]; then
            echo "❌ Tester report is missing or empty."
            exit 1
          fi

          python -c "import json; json.load(open('$REPORT', encoding='utf-8'))"

          echo "🟢 Tester report exists and contains valid JSON."
          cat "$REPORT"


      # --------------------------------------------------------
      # CHECK BRAIN FILES
      # --------------------------------------------------------

      - name: Inspect Zybot Brain directory
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Brain directory:"
          ls -lah bot/thinker/brain

          echo ""
          echo "Training data:"
          ls -lh bot/thinker/brain/training_data.json


      # --------------------------------------------------------
      # TRAIN ZYBOT'S OWN BRAIN
      # --------------------------------------------------------

      - name: Train Zybot Brain
        run: |
          echo "🧠 Starting Zybot Brain training..."

          python -m bot.thinker.brain.train

          echo ""
          echo "🧠 Training command completed."

          echo ""
          echo "Contents of brain directory after training:"
          ls -lah bot/thinker/brain

          MODEL="bot/thinker/brain/zybot-brain.json"

          if [ ! -s "$MODEL" ]; then
            echo "❌ Zybot Brain was not created or is empty."
            exit 1
          fi

          echo "🟢 Zybot Brain file successfully created."
          ls -lh "$MODEL"


      # --------------------------------------------------------
      # VERIFY BRAIN BEFORE INFERENCE
      # --------------------------------------------------------

      - name: Verify Zybot Brain
        run: |
          echo "🧠 Final pre-inference verification..."

          MODEL="bot/thinker/brain/zybot-brain.json"

          if [ ! -s "$MODEL" ]; then
            echo "❌ Zybot Brain is missing or empty."
            exit 1
          fi

          echo "🟢 Zybot Brain is present and non-empty."

          echo ""
          echo "Model size:"
          wc -c "$MODEL"

          echo ""
          echo "Model path:"
          realpath "$MODEL"


      # --------------------------------------------------------
      # RUN ZYBOT'S OWN AI
      # --------------------------------------------------------

      - name: Run Zybot AI Thinker
        run: |
          echo "🧠 Starting Zybot AI Thinker..."
          python bot/thinker/think.py


      # --------------------------------------------------------
      # SAVE AI THOUGHTS
      # --------------------------------------------------------

      - name: Save AI thoughts
        run: |
          git config user.name "Zybot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot/archive/zybot-thoughts.json

          if git diff --cached --quiet; then
            echo "No new AI thoughts."
            exit 0
          fi

          git commit -m "🤖 Zybot: archive AI thoughts"

          echo "🔄 Synchronizing with remote projects branch..."

          git fetch origin projects
          git rebase origin/projects

          echo "🚀 Pushing AI Thinker update..."

          git push origin HEAD:projects
