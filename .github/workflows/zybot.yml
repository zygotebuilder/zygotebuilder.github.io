name: Zybot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  inspect:
    name: 🔬 Inspect Zygote Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Zybot Observer
        run: python bot/observer/inspect.py


  test:
    name: 🧪 Test Zygote Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Zybot Tester
        run: python bot/tester/test_projects.py

  report:
    name: 📋 Zybot Reporter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: gh --version

      - name: Run Zybot Reporter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/reporter/report.py
      
 
