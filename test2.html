<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Cartography & Galactic Clusters</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .subtitle {
            font-size: 0.75rem;
            color: #888899;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* Search & Controls */
        .controls-panel {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            background: rgba(15, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 16px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            width: 200px;
        }

        .search-box:focus {
            border-color: rgba(100, 150, 255, 0.5);
            box-shadow: 0 0 15px rgba(100, 150, 255, 0.2);
            width: 240px;
        }

        .btn {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(40, 40, 60, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Star / Galaxy Info Card */
        .info-card {
            background: rgba(10, 10, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        .info-card.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .info-card h2 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }

        .info-row span:first-child {
            color: #888899;
        }

        .info-row span:last-child {
            color: #e0e0ff;
            font-family: monospace;
        }

        /* Instructions Overlay */
        .instructions {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
            text-align: center;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .ui-layer { padding: 16px; }
            header { flex-direction: column; gap: 12px; }
            .controls-panel { width: 100%; justify-content: space-between; }
            .search-box { width: 140px; }
            .search-box:focus { width: 180px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <div>
                <h1>STELLAR CARTOGRAPHY</h1>
                <div class="subtitle">INTERACTIVE GALACTIC CLUSTER SIMULATION</div>
            </div>
            <div class="controls-panel interactive">
                <input type="text" id="search-input" class="search-box" placeholder="Search system...">
                <button id="reset-btn" class="btn">Cluster View</button>
            </div>
        </header>

        <div style="display: flex; justify-content: flex-end;">
            <div id="info-card" class="info-card interactive">
                <h2 id="info-title">System Name</h2>
                <div class="info-row"><span>Classification</span><span id="info-class">-</span></div>
                <div class="info-row"><span>Distance</span><span id="info-dist">-</span></div>
                <div class="info-row"><span>Luminosity</span><span id="info-lum">-</span></div>
                <div class="info-row"><span>Mass</span><span id="info-mass">-</span></div>
            </div>
        </div>

        <div class="instructions">
            CLICK/TAP ANY STAR TO INSPECT • SEAMLESS SWITCHING ENABLED • SCROLL TO ZOOM
        </div>
    </div>

    <!-- Include Three.js and GSAP for smooth structural transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        // --- SCENE INITIALIZATION & SETUP ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(0, 450, 700);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        container.appendChild(renderer.domElement);

        // --- INTERACTION & STATE VARIABLES ---
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let interactiveObjects = [];
        let selectedStar = null;
        let isFocused = false;
        
        // Target tracking for smooth camera movement
        let controlsTarget = new THREE.Vector3(0, 0, 0);
        let cameraTargetPos = new THREE.Vector3(0, 450, 700);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // --- PROCEDURAL GALACTIC CLUSTERS GENERATION ---
        const clusterGroup = new THREE.Group();
        scene.add(clusterGroup);

        // Define galactic cluster nodes (Brighter, clustered composition)
        const galaxyNodes = [
            { name: "Milky Way Core", offset: new THREE.Vector3(0, 0, 0), scale: 1.2, brightness: 2.0, count: 25000, color: 0x90ccff },
            { name: "Andromeda Super-Node", offset: new THREE.Vector3(450, 80, -300), scale: 1.5, brightness: 2.2, count: 30000, color: 0xffd0a0 },
            { name: "Triangulum Outpost", offset: new THREE.Vector3(-500, -60, -250), scale: 0.8, brightness: 1.8, count: 15000, color: 0xa0ffd0 },
            { name: "Sombrero Cluster", offset: new THREE.Vector3(200, -200, 400), scale: 1.0, brightness: 1.9, count: 18000, color: 0xffa0b0 }
        ];

        const starDataRegistry = [];

        galaxyNodes.forEach((gNode, gIndex) => {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            const colorBase = new THREE.Color(gNode.color);

            for (let i = 0; i < gNode.count; i++) {
                // Logarithmic spiral distribution for galaxies
                const radius = Math.pow(Math.random(), 2) * 350 * gNode.scale;
                const arms = 4;
                const armAngle = ((i % arms) / arms) * Math.PI * 2;
                const spiralFactor = radius * 0.003;
                const theta = armAngle + spiralFactor * 4;

                const x = Math.cos(theta) * radius + (Math.random() - 0.5) * 35 * gNode.scale;
                const y = (Math.random() - 0.5) * (40 * gNode.scale) * (1 / (radius * 0.01 + 1)); // Flattened disk
                const z = Math.sin(theta) * radius + (Math.random() - 0.5) * 35 * gNode.scale;

                positions.push(x + gNode.offset.x, y + gNode.offset.y, z + gNode.offset.z);

                // High brightness variation
                const mixedColor = colorBase.clone();
                mixedColor.offsetHSL(0, 0, (Math.random() - 0.5) * 0.3);
                colors.push(mixedColor.r * gNode.brightness, mixedColor.g * gNode.brightness, mixedColor.b * gNode.brightness);

                sizes.push(Math.random() * 3.5 + 0.8);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Custom glowing point material
            const starMaterial = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false,
                opacity: 0.95
            });

            const galaxySystem = new THREE.Points(geometry, starMaterial);
            clusterGroup.add(galaxySystem);
        });

        // --- INTERACTIVE HIGHLIGHT STAR SYSTEMS ---
        // Feature key selectable individual anchor stars within the cluster
        const anchorStars = [
            { name: "Sol (System Alpha)", class: "G2V Main Sequence", dist: "0.0 kly", lum: "1.0 L☉", mass: "1.0 M☉", pos: new THREE.Vector3(0, 5, 0) },
            { name: "Rigel Prime", class: "B8Iab Supergiant", dist: "863 ly", lum: "120,000 L☉", mass: "21 M☉", pos: new THREE.Vector3(120, 25, -80) },
            { name: "Betelgeuse Major", class: "M1-2 Red Supergiant", dist: "642 ly", lum: "126,000 L☉", mass: "16.5 M☉", pos: new THREE.Vector3(-150, -10, 90) },
            { name: "Sirius Galactic", class: "A1V Binary System", dist: "8.6 ly", lum: "25.4 L☉", mass: "2.02 M☉", pos: new THREE.Vector3(60, -15, 110) },
            { name: "Andromeda Anchor-1", class: "O5V Hypergiant", dist: "2.5 Mly", lum: "1,500,000 L☉", mass: "60 M☉", pos: new THREE.Vector3(480, 75, -280) },
            { name: "Triangulum Marker B", class: "LBV Variable", dist: "2.73 Mly", lum: "800,000 L☉", mass: "45 M☉", pos: new THREE.Vector3(-460, -40, -220) },
            { name: "Sombrero Sentinel", class: "K0III Giant", dist: "29.3 Mly", lum: "600 L☉", mass: "2.5 M☉", pos: new THREE.Vector3(220, -180, 380) }
        ];

        const anchorGeometry = new THREE.SphereGeometry(3.5, 16, 16);
        const anchorMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

        anchorStars.forEach((data, index) => {
            const mesh = new THREE.Mesh(anchorGeometry, anchorMaterial.clone());
            mesh.position.copy(data.pos);
            mesh.userData = data;
            
            // Add an intense glowing aura sprite/sphere
            const glowGeo = new THREE.SphereGeometry(7, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x88bbff,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });
            mesh.add(new THREE.Mesh(glowGeo, glowMat));

            scene.add(mesh);
            interactiveObjects.push(mesh);
            starDataRegistry.push({ name: data.name.toLowerCase(), mesh: mesh });
        });

        // --- NAVIGATION & CONTROLS (Manual Orbit/Pan implementation for smoothness) ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = new THREE.Vector2(0, 0);
        let currentRotation = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.interactive')) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            targetRotation.y += deltaX * 0.005;
            targetRotation.x += deltaY * 0.005;
            targetRotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotation.x));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('wheel', (e) => {
            const zoomFactor = 1.2;
            if (e.deltaY > 0) {
                camera.position.multiplyScalar(zoomFactor);
            } else {
                camera.position.divideScalar(zoomFactor);
            }
            // Clamp zoom distance
            camera.position.clampLength(40, 2500);
        }, { passive: true });

        // Touch support for mobile devices
        let touchStartDist = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.interactive')) return;
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = false;
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = touchStartDist / dist;
                camera.position.multiplyScalar(factor > 1 ? 1.02 : 0.98);
                touchStartDist = dist;
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // --- CLICK / TAP SELECTION & SPONTANEOUS SWITCHING LOGIC ---
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const hitStar = intersects[0].object;
                focusOnStar(hitStar);
            }
        });

        function focusOnStar(starMesh) {
            selectedStar = starMesh;
            isFocused = true;

            // Update UI card details immediately
            const data = starMesh.userData;
            document.getElementById('info-title').innerText = data.name;
            document.getElementById('info-class').innerText = data.class;
            document.getElementById('info-dist').innerText = data.dist;
            document.getElementById('info-lum').innerText = data.lum;
            document.getElementById('info-mass').innerText = data.mass;
            document.getElementById('info-card').classList.add('visible');

            // Set smooth transition targets for camera and focal point
            controlsTarget.copy(starMesh.position);
            
            // Offset camera smoothly close to the selected star for spontaneous switching
            const offsetDir = camera.position.clone().sub(starMesh.position).normalize();
            if (offsetDir.lengthSq() === 0) offsetDir.set(0, 0, 1);
            cameraTargetPos.copy(starMesh.position).add(offsetDir.multiplyScalar(35));
        }

        // --- UI EVENT LISTENERS ---
        document.getElementById('reset-btn').addEventListener('click', () => {
            isFocused = false;
            selectedStar = null;
            document.getElementById('info-card').classList.remove('visible');
            controlsTarget.set(0, 0, 0);
            cameraTargetPos.set(0, 450, 700);
        });

        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.toLowerCase().trim();
                const found = starDataRegistry.find(item => item.name.includes(query));
                if (found) {
                    focusOnStar(found.mesh);
                    searchInput.blur();
                }
            }
        });

        // --- WINDOW RESIZING ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Gentle cluster rotation over time
            clusterGroup.rotation.y += 0.02 * delta;

            // Smooth interpolation (lerp) for camera positioning and focus switching
            if (isFocused) {
                camera.position.lerp(cameraTargetPos, 0.08);
                // Keep camera looking smoothly at the target star system
                camera.lookAt(controlsTarget);
            } else {
                // Free exploration rotation handling
                currentRotation.lerp(targetRotation, 0.08);
                
                const distance = camera.position.length();
                camera.position.x = controlsTarget.x + distance * Math.sin(currentRotation.y) * Math.cos(currentRotation.x);
                camera.position.y = controlsTarget.y + distance * Math.sin(currentRotation.x);
                camera.position.z = controlsTarget.z + distance * Math.cos(currentRotation.y) * Math.cos(currentRotation.x);
                camera.lookAt(controlsTarget);
            }

            // Pulsating highlight glow for anchor stars
            interactiveObjects.forEach((obj, idx) => {
                const scaleFactor = 1 + Math.sin(clock.getElapsedTime() * 3 + idx) * 0.15;
                obj.scale.set(scaleFactor, scaleFactor, scaleFactor);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
