<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>CIVICA — The City Is Ours</title>
<style>
:root{
  --ink:#122018;--muted:#66736b;--paper:#f5f1e8;--panel:rgba(255,255,255,.9);
  --green:#35b56b;--green2:#18794b;--blue:#3d86e8;--orange:#ef8b39;
  --red:#e05252;--yellow:#f2c94c;--road:#343b42;--road2:#424a52;
  --shadow:0 20px 60px rgba(15,31,22,.18);--radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#dfe9df}
button{font:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
body{overflow-x:hidden}
#app{min-height:100vh;position:relative;overflow:hidden;background:
 radial-gradient(circle at 15% 15%,rgba(255,255,255,.9),transparent 28%),
 linear-gradient(145deg,#e8efe6,#cdded1 55%,#b8ced0)}
.screen{min-height:100vh;padding:28px;position:relative}
.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
/* ---------- landing ---------- */
.hero{max-width:1200px;margin:auto;min-height:calc(100vh - 56px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:45px}
.kicker{font-size:.78rem;letter-spacing:.22em;font-weight:900;color:var(--green2);text-transform:uppercase}
.logo{font-size:clamp(3.6rem,8vw,7rem);line-height:.86;letter-spacing:-.08em;font-weight:950;margin:14px 0}
.logo span{display:block;color:var(--green)}
.hero h2{font-size:clamp(1.4rem,3vw,2.5rem);line-height:1.08;margin:0 0 18px;max-width:650px}
.hero p{font-size:1.05rem;line-height:1.7;color:#46544c;max-width:650px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{padding:15px 22px;border-radius:15px;font-weight:850;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.03)}
.btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:white;box-shadow:0 12px 25px rgba(24,121,75,.25)}
.btn.secondary{background:white;color:var(--ink);border:1px solid #d9e0d9}
.btn.danger{background:#fff0f0;color:#a83232}
.feature-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.feature{padding:10px 13px;border-radius:999px;background:rgba(255,255,255,.62);font-size:.84rem;font-weight:750;color:#425048}
.city-preview{height:570px;position:relative;perspective:1000px}
.city-card{position:absolute;inset:35px 0 35px 25px;border-radius:34px;overflow:hidden;background:#7fb18d;transform:rotateX(9deg) rotateZ(-4deg);box-shadow:35px 45px 70px rgba(25,50,35,.28)}
.city-sky{height:44%;background:linear-gradient(#83c5e5,#d6edf0);position:relative}
.sun{position:absolute;width:75px;height:75px;border-radius:50%;background:#ffd66b;right:12%;top:15%;box-shadow:0 0 45px #ffe69b}
.cloud{position:absolute;color:white;font-size:50px;opacity:.72}
.cloud.a{left:10%;top:18%}.cloud.b{right:30%;top:35%;font-size:34px}
.city-ground{position:absolute;left:-15%;right:-15%;top:37%;height:75%;transform:rotateX(60deg);transform-origin:top;background:
 repeating-linear-gradient(90deg,transparent 0 105px,rgba(255,255,255,.5) 106px 110px),
 linear-gradient(90deg,#4b5258 0 45%,#e6c85b 45% 47%,#4b5258 47% 100%);border-top:7px solid #333a40}
.city-building{position:absolute;bottom:30%;background:linear-gradient(90deg,#d7d0bd,#a9a79e);border-radius:5px 5px 0 0;box-shadow:inset 8px 0 rgba(0,0,0,.08)}
.city-building:after{content:"";position:absolute;inset:12px;background:repeating-linear-gradient(90deg,#82a9ac 0 12px,transparent 12px 23px);opacity:.8}
.b1{left:7%;width:18%;height:42%}.b2{left:27%;width:16%;height:30%;background:#d6b69e}.b3{right:8%;width:22%;height:50%;background:#9fb5b0}.b4{right:31%;width:13%;height:25%;background:#d8d0a9}
.preview-tree{position:absolute;bottom:22%;font-size:55px;z-index:5}.pt1{left:9%}.pt2{right:11%}
.preview-car{position:absolute;bottom:14%;left:42%;font-size:55px;z-index:6;animation:drive 5s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(-80px)}50%{transform:translateX(80px)}}
.stamp{position:absolute;right:10px;bottom:5px;background:#fff;border-radius:12px;padding:9px 12px;font-size:.7rem;font-weight:900;transform:rotate(4deg);box-shadow:0 8px 20px #0002}
/* ---------- map ---------- */
.map-screen{padding:24px;max-width:1400px;margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand-mini{font-weight:950;letter-spacing:-.04em;font-size:1.35rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:rgba(255,255,255,.78);padding:9px 13px;border-radius:12px;font-size:.82rem;font-weight:800}
.map-layout{display:grid;grid-template-columns:1fr 330px;gap:18px}
.map{min-height:690px;border-radius:28px;position:relative;overflow:hidden;background:
 linear-gradient(90deg,transparent 0 49%,#bfc7c0 49% 51%,transparent 51%),
 linear-gradient(#d9e0d6 0 49%,#bfc7c0 49% 51%,#d9e0d6 51% 100%),
 #d9e0d6;box-shadow:var(--shadow);border:8px solid #f4f1e8}
.map:before,.map:after{content:"";position:absolute;background:#9ec09d;border-radius:50%}
.map:before{width:260px;height:180px;left:-50px;top:35px}.map:after{width:300px;height:180px;right:-90px;bottom:20px}
.map-road{position:absolute;background:#525960;box-shadow:inset 0 0 0 2px #3f454b}
.map-road.h{left:0;right:0;height:90px}.map-road.v{top:0;bottom:0;width:90px}
.map-road.h.r1{top:30%}.map-road.h.r2{top:70%}.map-road.v.r1{left:26%}.map-road.v.r2{left:72%}
.map-road.h:after{content:"";position:absolute;left:0;right:0;top:43px;border-top:4px dashed #e9d36d}
.map-road.v:after{content:"";position:absolute;top:0;bottom:0;left:43px;border-left:4px dashed #e9d36d}
.park{position:absolute;background:#82b67d;border-radius:30px;box-shadow:inset 0 0 0 5px #72a76e}
.park:after{content:"🌳  🌳  🌳";position:absolute;font-size:24px;inset:30px;opacity:.8}
.p1{width:23%;height:22%;left:2%;top:3%}.p2{width:20%;height:22%;right:3%;top:3%}.p3{width:22%;height:20%;left:2%;bottom:3%}
.map-node{position:absolute;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;z-index:5;background:white;border:7px solid var(--green);box-shadow:0 12px 30px #23452a33;transition:.2s}
.map-node:hover{transform:scale(1.07)}.map-node.locked{filter:grayscale(1);opacity:.58;border-color:#9aa49e}.map-node.done{background:#eafff0}
.map-node .emoji{font-size:34px}.map-node .label{position:absolute;top:104%;white-space:nowrap;font-weight:900;font-size:.78rem;background:#fff;padding:6px 9px;border-radius:9px;box-shadow:0 5px 15px #0001}
.n1{left:11%;top:18%}.n2{left:40%;top:16%}.n3{right:10%;top:18%}.n4{left:15%;top:49%}.n5{left:43%;top:49%}.n6{right:13%;top:49%}.n7{left:42%;bottom:8%}
.map-path{position:absolute;z-index:2;pointer-events:none;border-top:5px dotted #fff9}
.map-legend{position:absolute;left:20px;bottom:18px;background:#ffffffdd;border-radius:15px;padding:12px;font-size:.76rem;line-height:1.6;z-index:8}
.side-panel{border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.side-panel h2{margin:0;font-size:1.4rem}.side-panel p{color:var(--muted);line-height:1.55;font-size:.9rem}
.lesson{padding:15px;border-radius:16px;background:#f2f8f3;border-left:5px solid var(--green)}
.lesson strong{display:block;margin-bottom:4px}.lesson small{color:#607067;line-height:1.5}
.progress{height:10px;border-radius:99px;background:#dce5dd;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#8bd65f);width:0;transition:.5s}
/* ---------- game ---------- */
.game-screen{min-height:100vh;padding:12px;background:linear-gradient(#b8d8e6 0 29%,#c8d8bf 29% 100%)}
.gamebar{height:64px;background:#ffffffdf;backdrop-filter:blur(14px);border-radius:17px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:10px;box-shadow:0 8px 25px #20382c18;position:relative;z-index:30}
.gamebar-left,.gamebar-right{display:flex;align-items:center;gap:8px}.level-name{font-weight:950}.meter{display:flex;gap:5px;align-items:center}.meter span{background:#edf4ed;padding:7px 9px;border-radius:10px;font-size:.76rem;font-weight:850}
.game-wrap{height:calc(100vh - 88px);min-height:560px;position:relative;margin-top:10px;border-radius:25px;overflow:hidden;background:linear-gradient(#8bc5e4 0 31%,#c6d4bb 31%);box-shadow:var(--shadow)}
.sky{position:absolute;inset:0 0 69% 0;background:linear-gradient(#79badb,#d5eced)}
.sun2{position:absolute;width:90px;height:90px;border-radius:50%;right:9%;top:8%;background:#ffe078;box-shadow:0 0 50px #fff0a4}
.horizon{position:absolute;left:0;right:0;top:25%;height:18%;background:
 linear-gradient(90deg,#7a9a8a 0 8%,transparent 8% 12%,#829a8c 12% 20%,transparent 20% 24%,#7d9286 24% 34%,transparent 34% 39%,#6f8d80 39% 47%,transparent 47% 54%,#829b8d 54% 63%,transparent 63% 68%,#718b7d 68% 78%,transparent 78% 83%,#81998b 83% 100%);opacity:.85}
.street{position:absolute;left:-10%;right:-10%;bottom:-25%;height:74%;background:
 repeating-linear-gradient(90deg,transparent 0 9%,#f1d66c 9.2% 9.8%,transparent 10% 20%),
 linear-gradient(105deg,#3c4248 0 100%);transform:perspective(500px) rotateX(17deg);transform-origin:bottom}
.sidewalk{position:absolute;bottom:17%;height:20%;width:52%;background:repeating-linear-gradient(0deg,#aaa89f 0 16px,#9b9991 17px 19px);z-index:4}
.sidewalk.left{left:-8%;transform:skewY(9deg)}.sidewalk.right{right:-8%;transform:skewY(-9deg)}
.curb{position:absolute;bottom:31%;height:12px;width:52%;background:#e8e3cf;z-index:5}.curb.left{left:-7%;transform:skewY(8deg)}.curb.right{right:-7%;transform:skewY(-8deg)}
.buildings{position:absolute;left:0;right:0;top:24%;height:30%;z-index:2;display:flex;justify-content:space-around;align-items:flex-end}
.bld{width:10%;min-width:75px;height:65%;border-radius:5px 5px 0 0;background:linear-gradient(90deg,#d3c7ae,#b7b3a6);box-shadow:inset 7px 0 #0001}
.bld:nth-child(2){height:88%;background:#c8a995}.bld:nth-child(3){height:53%;background:#aebfbb}.bld:nth-child(4){height:78%;background:#d1c6a6}.bld:nth-child(5){height:48%;background:#a7b9a7}.bld:nth-child(6){height:72%;background:#c5aaa0}
.bld:after{content:"";display:block;margin:14px;height:80%;background:repeating-linear-gradient(90deg,#6e9698 0 10px,transparent 10px 20px)}
.street-object{position:absolute;z-index:9;user-select:none}.tree3{font-size:70px;bottom:28%;filter:drop-shadow(0 9px 4px #0002)}.tree3.l{left:7%}.tree3.r{right:7%}
.person{font-size:58px;bottom:28%;z-index:10}.person.l{left:22%}.person.r{right:22%}
.bin3{font-size:50px;bottom:29%;z-index:10}.bin3.l{left:17%}.bin3.r{right:17%}
.car3{font-size:62px;bottom:38%;z-index:8;animation:traffic 8s linear infinite}.car3.a{left:8%}.car3.b{right:8%;animation-delay:-4s;animation-direction:reverse}
@keyframes traffic{0%{transform:translateX(-40px)}50%{transform:translateX(150px)}100%{transform:translateX(-40px)}}
.player{position:absolute;z-index:20;left:50%;bottom:30%;transform:translateX(-50%);font-size:72px;transition:left .16s ease,transform .16s}
.player.walk{animation:walk .22s infinite alternate}.player.bump{animation:bump .35s}
@keyframes walk{to{transform:translateX(-50%) translateY(-7px)}}@keyframes bump{25%{transform:translateX(-50%) rotate(-8deg)}75%{transform:translateX(-50%) rotate(8deg)}}
.waste{position:absolute;z-index:14;font-size:35px;cursor:pointer;transition:.2s;filter:drop-shadow(0 5px 4px #0003);user-select:none}
.waste:hover{transform:scale(1.2) rotate(6deg)}.waste.collected{transform:scale(0);opacity:0}
.waste .tag{position:absolute;left:50%;bottom:105%;transform:translateX(-50%);font-size:.65rem;background:#fff;padding:4px 7px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}.waste:hover .tag{opacity:1}
.interaction{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:25;background:#ffffffdf;padding:11px 15px;border-radius:14px;text-align:center;font-size:.8rem;font-weight:800;box-shadow:0 10px 30px #0002}
.game-tip{position:absolute;left:18px;bottom:18px;z-index:25;background:#15231bdb;color:#fff;padding:12px 15px;border-radius:13px;max-width:310px;font-size:.77rem;line-height:1.45}
.task-panel{position:absolute;right:18px;top:82px;width:245px;z-index:26;border-radius:17px;padding:15px;background:#fffffff0;box-shadow:0 12px 30px #0002}
.task-panel h3{margin:0 0 8px;font-size:.9rem}.task{font-size:.75rem;padding:7px 0;border-bottom:1px solid #e6ebe6}.task:last-child{border:0}.task b{color:var(--green2)}
.clean-toast{position:absolute;z-index:40;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);opacity:0;background:#fff;border-radius:22px;padding:22px 30px;text-align:center;box-shadow:0 25px 70px #17332344;pointer-events:none;transition:.3s}
.clean-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.clean-toast .big{font-size:3rem}.clean-toast strong{display:block;font-size:1.25rem}.clean-toast small{color:var(--muted)}
/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:#10201899;backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:20px}
.modal-card{max-width:600px;width:100%;max-height:90vh;overflow:auto;border-radius:26px;padding:27px;background:#fff;box-shadow:0 30px 100px #0004}
.modal-card h2{margin:0 0 8px;font-size:2rem}.modal-card p{color:#58675e;line-height:1.6}.modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.lesson-big{padding:17px;border-radius:16px;background:#eff8f1;margin:12px 0;border-left:5px solid var(--green)}.lesson-big b{display:block;margin-bottom:5px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.choice{padding:14px;border:2px solid #e0e6e1;border-radius:14px;text-align:left;background:#fff}.choice:hover{border-color:var(--green)}.choice.correct{border-color:var(--green);background:#effaf2}.choice.wrong{border-color:var(--red);background:#fff2f2}
.rank{font-size:2.4rem;font-weight:950;color:var(--green2)}.score-big{font-size:3.3rem;font-weight:950;margin:4px 0}
@media(max-width:900px){
 .hero{grid-template-columns:1fr;padding:20px 0}.city-preview{height:360px}.city-card{inset:15px 0}
 .map-layout{grid-template-columns:1fr}.map{min-height:590px}.side-panel{order:-1}.map-node{width:74px;height:74px;border-width:5px}.map-node .emoji{font-size:26px}.map-node .label{font-size:.65rem}
 .task-panel{width:205px}.game-tip{max-width:230px}.player{font-size:60px}.waste{font-size:29px}
}
@media(max-width:620px){
 .screen{padding:16px}.logo{font-size:4rem}.hero h2{font-size:1.45rem}.hero p{font-size:.95rem}.city-preview{display:none}
 .gamebar{height:auto;min-height:58px}.level-name{display:none}.meter span{font-size:.68rem;padding:6px}
 .game-wrap{height:calc(100vh - 92px);min-height:620px}.task-panel{top:75px;right:10px;width:180px}.interaction{top:10%;font-size:.7rem}.game-tip{left:10px;bottom:10px}
 .map{min-height:620px}.map-node{width:66px;height:66px}.n1{left:8%}.n2{left:39%}.n3{right:7%}.n4{left:11%}.n5{left:40%}.n6{right:9%}.n7{left:39%}
}
</style>
</head>

function loadSave(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw) return JSON.parse(raw);
 }catch(e){}
 return {unlocked:1,completed:[],best:{},totalScore:0,streak:0};
}
function persist(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}
function resetProgress(){
 if(confirm("Reset all CIVICA progress in this browser? This cannot be undone.")){
  save={unlocked:1,completed:[],best:{},totalScore:0,streak:0};persist();renderMap();
 }
}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function renderLanding(){
 app.innerHTML=`
 <section class="screen">
  <div class="hero">
   <div>
    <div class="kicker">ZYGOTE BUILDER × CIVIC DESIGN</div>
    <div class="logo">CIVI<span>CA</span></div>
    <h2>The city is not a backdrop. <br>It is a shared responsibility.</h2>
    <p>A level-based 3D street adventure where reaching your destination means taking care of the route. Clean streets, understand waste, respect shared spaces, notice problems and make better civic decisions.</p>
    <div class="hero-actions">
      <button class="btn primary" onclick="openMap()">🗺️ Enter the City</button>
      <button class="btn secondary" onclick="showAbout()">How it works</button>
    </div>
    <div class="feature-row">
      <div class="feature">💾 Browser-only progress</div><div class="feature">🚫 No account</div>
      <div class="feature">🏙️ 7 city levels</div><div class="feature">🧠 Civic decisions</div>
    </div>
   </div>
   <div class="city-preview" aria-hidden="true">
    <div class="city-card">
      <div class="city-sky"><div class="sun"> </div><div class="cloud a">☁</div><div class="cloud b">☁</div></div>
      <div class="city-building b1"></div><div class="city-building b2"></div><div class="city-building b3"></div><div class="city-building b4"></div>
      <div class="city-ground"></div><div class="preview-tree pt1">🌳</div><div class="preview-tree pt2">🌳</div><div class="preview-car">🚌</div>
      <div class="stamp">A CITY-SENSE SIMULATION</div>
    </div>
   </div>
  </div>
 </section>`;
}

function openMap(){renderMap()}

function renderMap(){
 const completedCount=save.completed.length;
 const pct=Math.round(completedCount/LEVELS.length*100);
 app.innerHTML=`
 <section class="map-screen">
  <div class="topbar">
   <div class="brand-mini">CIVICA · CITY MAP</div>
   <div class="stats">
    <div class="stat">🏆 ${save.totalScore} points</div><div class="stat">🗺️ ${completedCount}/${LEVELS.length}</div>
    <button class="btn secondary" style="padding:9px 12px" onclick="renderLanding()">Home</button>
   </div>
  </div>
  <div class="map-layout">
   <div class="map">
    <div class="map-road h r1"></div><div class="map-road h r2"></div><div class="map-road v r1"></div><div class="map-road v r2"></div>
    <div class="park p1"></div><div class="park p2"></div><div class="park p3"></div>
    ${LEVELS.map((l,i)=>{
      const locked=l.id>save.unlocked,done=save.completed.includes(l.id);
      return `<button class="map-node n${i+1} ${locked?'locked':''} ${done?'done':''}" onclick="${locked?'lockedLevel()':'startLevel('+l.id+')'}" ${locked?'aria-label="Locked"':''}>
       <span class="emoji">${locked?'🔒':l.icon}</span><span class="label">${l.id}. ${escapeHTML(l.name)} ${done?'✓':''}</span></button>`;
    }).join("")}
    <div class="map-legend">🟢 Completed &nbsp; ⚪ Available &nbsp; 🔒 Locked<br><b>Rule of the city:</b> your destination is earned, not simply reached.</div>
   </div>
   <aside class="side-panel glass">
    <h2>Your city, your route.</h2>
    <p>Each neighborhood teaches one piece of civic sense. Finish the route, then answer one real-world decision.</p>
    <div><div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:850;margin-bottom:6px"><span>City progress</span><span>${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div></div>
    <div class="lesson"><strong>🧭 How to play</strong><small>Walk toward the destination. Click/tap things that need action. Some are litter; some are obstacles or public problems. The labels tell you what you are seeing.</small></div>
    <div class="lesson"><strong>🌱 The point</strong><small>You are not cleaning for points alone. You are practicing the habit of noticing what your surroundings need.</small></div>
    <button class="btn secondary" onclick="showAbout()">Civic principles</button>
    <button class="btn danger" onclick="resetProgress()">Reset local progress</button>
   </aside>
  </div>
 </section>`;
}
function lockedLevel(){toast("🔒 Finish the previous neighborhood first.");}
function toast(msg){
 const d=document.createElement("div");d.className="clean-toast show";d.innerHTML=`<div class="big">🏙️</div><strong>${msg}</strong>`;
 document.body.appendChild(d);setTimeout(()=>d.remove(),1300);
}

function startLevel(id){
 currentLevel=id;
 const l=LEVELS.find(x=>x.id===id);
 levelState={
  level:l,cleaned:0,score:0,actions:0,wastes:l.wastes.map((w,i)=>({id:i,type:w[2],emoji:w[0],name:w[1],x:w[3],y:w[4],done:false})),
  playerX:50,started:Date.now(),questionAnswered:false
 };
 renderGame();
}

function renderGame(){
 const l=levelState.level;
 app.innerHTML=`
 <section class="game-screen">
  <div class="gamebar">
   <div class="gamebar-left"><button class="btn secondary" style="padding:9px 12px" onclick="quitLevel()">← Map</button><div class="level-name">${l.icon} Level ${l.id}: ${escapeHTML(l.name)}</div></div>
   <div class="gamebar-right"><div class="meter"><span>🧹 <b id="cleanCount">0</b>/${l.goal}</span><span>⭐ <b id="levelScore">0</b></span></div></div>
  </div>
  <div class="game-wrap" id="gameWorld">
   <div class="sky"></div><div class="sun2"></div><div class="horizon"></div>
   <div class="buildings"><div class="bld"></div><div class="bld"></div><div class="bld"></div><div class="bld"></div><div class="bld"></div><div class="bld"></div></div>
   <div class="street"></div><div class="sidewalk left"></div><div class="sidewalk right"></div><div class="curb left"></div><div class="curb right"></div>
   <div class="street-object tree3 l">🌳</div><div class="street-object tree3 r">🌳</div>
   <div class="street-object bin3 l">🗑️</div><div class="street-object bin3 r">🗑️</div>
   <div class="street-object person l">🚶</div><div class="street-object person r">🧍</div>
   <div class="street-object car3 a">🚕</div><div class="street-object car3 b">🚙</div>
   <div class="player" id="player">🧑‍🌾</div>
   <div id="wasteLayer"></div>
   <div class="interaction">🎯 Clean / fix what you notice · then reach <b>${destinationFor(l.id)}</b></div>
   <div class="task-panel"><h3>ROUTE CHECK</h3><div class="task">🧹 Actions <b id="taskActions">0/${l.goal}</b></div><div class="task">📍 Destination <b>${destinationFor(l.id)}</b></div><div class="task">🧠 Civic theme <b>${l.theme}</b></div><div class="task" id="hintTask">💡 Click an object to inspect it.</div></div>
   <div class="game-tip" id="gameTip">Move with <b>← →</b> or <b>A / D</b>. On a phone, tap the road left/right of your character. Click visible problems to act. Your destination unlocks after the route is cared for.</div>
   <div class="clean-toast" id="toast"><div class="big">✨</div><strong id="toastTitle">Nice!</strong><small id="toastText">That small action matters.</small></div>
  </div>
 </section>`;
 renderWastes();
 bindMovement();
}

function destinationFor(id){
 return ["","the Library","the Recycling Centre","the School","the Water Office","the Community Hall","the Public Park","Civica Square"][id]||"Civica Square";
}
function renderWastes(){
 const layer=document.getElementById("wasteLayer");
 layer.innerHTML="";
 levelState.wastes.forEach(w=>{
  if(w.done)return;
  const el=document.createElement("button");el.className="waste";el.style.left=w.x+"%";el.style.bottom=(100-w.y)+"%";
  el.innerHTML=`${w.emoji}<span class="tag">${escapeHTML(w.name)}</span>`;
  el.onclick=()=>inspectWaste(w.id);layer.appendChild(el);
 });
 document.getElementById("cleanCount").textContent=levelState.cleaned;
 document.getElementById("taskActions").textContent=levelState.actions+"/"+levelState.level.goal;
 document.getElementById("levelScore").textContent=levelState.score;
}
function inspectWaste(id){
 const w=levelState.wastes.find(x=>x.id===id);if(!w||w.done)return;
 const layer=document.getElementById("wasteLayer");
 const el=[...layer.children].find(x=>x.textContent.includes(w.name));
 let title="Good catch.",text="";
 if(w.type==="wet")text="Organic material belongs in the appropriate organic/wet stream where your local system provides one.";
 else if(w.type==="dry")text="Dry recyclable-looking waste should be kept separate and handled according to local collection rules.";
 else if(w.type==="obstacle")text="A usable footpath is shared infrastructure. Obstructions can make movement difficult or unsafe for others.";
 else if(w.type==="water")text="Public water is a shared resource. Notice leaks and report them rather than ignoring them.";
 else if(w.type==="noise")text="Shared environments require consideration. Excessive noise can affect people nearby.";
 else if(w.type==="plant")text="Plants in public spaces are shared assets. Enjoy them without damaging them.";
 levelState.actions++;levelState.cleaned++;levelState.score+=10;
 w.done=true;
 if(el){el.classList.add("collected");setTimeout(renderWastes,220)}else renderWastes();
 showToast(title,text);
 if(levelState.cleaned>=levelState.level.goal){
  setTimeout(()=>showToast("Route cared for.","Now reach the destination. The city is ready for you."),650);
  document.getElementById("hintTask").innerHTML="🚶 <b>Now move to the destination.</b>";
 }
}
function showToast(title,text){
 const box=document.getElementById("toast");if(!box)return;
 document.getElementById("toastTitle").textContent=title;document.getElementById("toastText").textContent=text;
 box.classList.add("show");clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>box.classList.remove("show"),1800);
}
function bindMovement(){
 const world=document.getElementById("gameWorld"),player=document.getElementById("player");
 let moving=false;
 function move(dir){
  moving=true;
  levelState.playerX=Math.max(7,Math.min(93,levelState.playerX+dir*4));
  player.style.left=levelState.playerX+"%";player.classList.add("walk");
  if(levelState.playerX<=8||levelState.playerX>=92)checkDestination();
  setTimeout(()=>player.classList.remove("walk"),170);
 }
 document.onkeydown=e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){e.preventDefault();move(-1)}
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){e.preventDefault();move(1)}
  if(e.key==="Escape")quitLevel();
 };
 world.onclick=e=>{
  if(e.target.closest(".waste,.task-panel,.gamebar,.interaction,.game-tip"))return;
  const r=world.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1);
 };
 world.ontouchstart=e=>{
  if(e.target.closest(".waste,.task-panel,.gamebar,.interaction,.game-tip"))return;
  const t=e.touches[0],r=world.getBoundingClientRect();move(t.clientX<r.left+r.width/2?-1:1);
 };
}
function checkDestination(){
 if(levelState.cleaned<levelState.level.goal){
  showToast("Not yet.","Care for the route before you leave it.");return;
 }
 showQuestion();
}
function showQuestion(){
 if(levelState.questionAnswered)return;
 levelState.questionAnswered=true;
 const q=levelState.level.question;
 const modal=document.createElement("div");modal.className="modal";modal.id="questionModal";
 modal.innerHTML=`<div class="modal-card"><div class="kicker">CIVIC DECISION · LEVEL ${levelState.level.id}</div>
 <h2>${escapeHTML(q[0])}</h2><p>You are at the destination. There is no timer here—the important part is choosing a principle you could actually use outside the game.</p>
 <div class="choice-grid">${q.slice(1).map((x,i)=>`<button class="choice" onclick="answerQuestion(${i},this)">${escapeHTML(x)}</button>`).join("")}</div>
 <div id="questionFeedback"></div></div>`;
 document.body.appendChild(modal);
}
function answerQuestion(i,el){
 const l=levelState.level,q=l.question,feedback=document.getElementById("questionFeedback");
 document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
 if(i===l.answer){
  el.classList.add("correct");levelState.score+=30;
  feedback.innerHTML=`<div class="lesson-big"><b>✓ Exactly.</b>${escapeHTML(l.lesson)}</div><div class="modal-actions"><button class="btn primary" onclick="finishLevel()">Continue →</button></div>`;
 }else{
  el.classList.add("wrong");
  feedback.innerHTML=`<div class="lesson-big" style="border-color:var(--red);background:#fff5f5"><b>Think again.</b>${escapeHTML(l.lesson)}</div><div class="modal-actions"><button class="btn secondary" onclick="retryQuestion()">Try again</button></div>`;
 }
}
function retryQuestion(){document.getElementById("questionModal")?.remove();levelState.questionAnswered=false;showQuestion()}
function finishLevel(){
 document.getElementById("questionModal")?.remove();
 const id=currentLevel;
 const first=!save.completed.includes(id);
 if(first)save.completed.push(id);
 save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,id+1));
 const old=save.best[id]||0;const gained=Math.max(old,levelState.score);
 save.best[id]=gained;
 save.totalScore+=first?levelState.score:Math.max(0,levelState.score-old);
 save.streak=(save.streak||0)+1;persist();
 showComplete();
}
function showComplete(){
 const l=levelState.level,next=LEVELS[currentLevel]||null;
 app.innerHTML=`<section class="screen" style="display:grid;place-items:center"><div class="modal-card glass" style="max-width:680px;text-align:center">
  <div style="font-size:5rem">🏙️✨</div><div class="kicker">NEIGHBORHOOD COMPLETED</div>
  <h2>${escapeHTML(l.name)} is ready.</h2><p>${escapeHTML(l.lesson)}</p>
  <div class="score-big">${levelState.score}</div><div style="font-weight:850;color:var(--muted)">POINTS EARNED · ${levelState.cleaned} CIVIC ACTIONS</div>
  <div class="lesson-big" style="text-align:left"><b>Remember this outside the game.</b>Civic sense is not a score. The score is only a way to make the habit visible while you learn it.</div>
  <div class="modal-actions" style="justify-content:center">
   <button class="btn secondary" onclick="renderMap()">🗺️ City Map</button>
   ${next?`<button class="btn primary" onclick="startLevel(${next.id})">Next: ${escapeHTML(next.name)} →</button>`:`<button class="btn primary" onclick="renderMap()">🏆 View City</button>`}
  </div>
 </div></section>`;
}
function quitLevel(){
 if(confirm("Leave this level? Your completed levels remain saved, but this level's current run will not be saved."))renderMap();
}
function showAbout(){
 const modal=document.createElement("div");modal.className="modal";
 modal.innerHTML=`<div class="modal-card"><div class="kicker">WHY CIVICA EXISTS</div><h2>Practice noticing.</h2>
 <p>Civic sense is often taught as a list of rules. CIVICA tries something different: make the player responsible for a place, then let the consequences become visible.</p>
 <div class="lesson-big"><b>01 · Shared ownership</b>A public place is not ownerless. It is shared.</div>
 <div class="lesson-big"><b>02 · Small actions compound</b>One wrapper seems tiny. Millions of tiny decisions shape a city.</div>
 <div class="lesson-big"><b>03 · Notice before solving</b>Good citizenship starts with seeing what other people have stopped noticing.</div>
 <div class="lesson-big"><b>04 · Rules have reasons</b>Waste sorting, crossings, water conservation and noise limits protect systems and people.</div>
 <div class="lesson-big"><b>05 · No hero complex</b>A civic city is not fixed by one superhero. It is maintained by ordinary people repeatedly doing ordinary things well.</div>
 <div class="modal-actions"><button class="btn primary" onclick="this.closest('.modal').remove()">Got it</button></div></div>`;
 document.body.appendChild(modal);
}

renderLanding();
</script>
</body>
</html>
